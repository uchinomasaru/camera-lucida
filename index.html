<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>カメラ・ルシダ アプリ - 究極のワークフロー版</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="カメラルシダ">

  <style>
    body {
      margin: 0; padding: 0; background-color: #333; color: white;
      font-family: sans-serif; display: flex; flex-direction: column;
      height: 100vh; overflow: hidden; 
    }

    #password-screen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background-color: #222; z-index: 9999; display: flex; flex-direction: column;
      justify-content: center; align-items: center;
    }
    #password-screen h2 { margin-bottom: 20px; }
    #password-screen p { margin-bottom: 10px; font-size: 14px; color: #ccc; text-align: center; line-height: 1.5; }
    #pass-input { padding: 10px; font-size: 16px; margin-bottom: 15px; border-radius: 5px; border: none; text-align: center; width: 220px; }
    #login-btn { padding: 10px 20px; font-size: 16px; background-color: #5cb85c; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
    #error-msg { color: #d9534f; margin-top: 15px; display: none; font-weight: bold; text-align: center; padding: 0 20px; }
    
    #show-ui-btn { position: absolute; top: 15px; right: 15px; z-index: 100; background-color: rgba(0, 0, 0, 0.6); color: white; border: 1px solid #777; padding: 10px 15px; border-radius: 5px; font-size: 14px; cursor: pointer; display: none; }
    
    /* ★追加：全画面表示時のフローティング・ロックボタン（左上） */
    #floating-lock-btn {
      position: absolute; top: 15px; left: 15px; z-index: 100; 
      background-color: rgba(0, 0, 0, 0.6); color: white; border: 1px solid #777; 
      padding: 10px 15px; border-radius: 5px; font-size: 14px; cursor: pointer; display: none; 
    }
    #floating-lock-btn.locked-btn { background-color: #d9534f !important; color: white !important; border-color: #d43f3a !important;}
    
    #toggle-image-btn { position: absolute; bottom: 20px; left: 10px; z-index: 100; background-color: rgba(0, 0, 0, 0.6); color: white; border: 1px solid #777; padding: 10px 10px; border-radius: 8px; font-size: 12px; font-weight: bold; cursor: pointer; display: none; }
    .image-hidden-state { background-color: #5cb85c !important; border-color: #4cae4c !important; }
    
    #tone-controls {
      position: absolute; bottom: 20px; right: 10px; z-index: 100; 
      background-color: rgba(0, 0, 0, 0.6); border: 1px solid #777;
      padding: 5px 6px; border-radius: 8px; display: none; gap: 3px; align-items: center;
    }
    .tone-btn {
      width: 22px; height: 26px; padding: 0 !important; border-radius: 4px;
      font-weight: bold; font-size: 11px; display: flex; justify-content: center; align-items: center;
      border: 1px solid #555 !important; cursor: pointer;
    }
    .active-tone { outline: 2px solid #ff4d4d; outline-offset: 1px; z-index: 2; border-color: #fff !important; }
    
    #controls { padding: 8px; background-color: #222; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; border-bottom: 1px solid #444; z-index: 10; max-height: 50vh; overflow-y: auto; }
    .control-group { display: flex; align-items: center; gap: 5px; background: #444; padding: 4px 8px; border-radius: 5px; flex-wrap: wrap; font-size: 13px; }
    #hide-ui-btn { background-color: #5cb85c; color: white; font-weight: bold; }

    #video-container { flex-grow: 1; display: flex; justify-content: center; align-items: center; overflow: hidden; position: relative; background-color: #000; touch-action: none; }
    #workspace { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; position: absolute; transform-origin: center center; }
    video { max-width: 100%; max-height: 100%; z-index: 1; }
    
    #image-wrapper { position: absolute; z-index: 2; opacity: 0.5; display: none; cursor: move; transform-origin: center center; }
    /* ★変更：画像を直接透明にするための設定準備 */
    #reference-image { display: block; max-width: 100vw; max-height: 100vh; pointer-events: none; user-select: none; transition: opacity 0.2s ease; }
    
    .anchor-point {
      position: absolute; width: 40px; height: 40px; margin-left: -20px; margin-top: -20px;
      pointer-events: auto; cursor: move; display: none; z-index: 10; transform-origin: center center;
      filter: drop-shadow(0px 0px 2px rgba(255,255,255,0.9));
    }
    .anchor-point::before, .anchor-point::after { content: ''; position: absolute; background: #ff4d4d; }
    .anchor-point::before { left: 50%; top: 0; width: 1px; height: 100%; transform: translateX(-50%); }
    .anchor-point::after { left: 0; top: 50%; width: 100%; height: 1px; transform: translateY(-50%); }
    .anchor-circle { 
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: 18px; height: 18px; border: 1px solid #ff4d4d; border-radius: 50%; box-sizing: border-box; 
    }
    .anchor-point span {
      position: absolute; top: -16px; left: 20px; color: #ff4d4d; font-weight: bold; font-size: 13px;
      text-shadow: -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff;
    }

    select, button { padding: 5px 8px; font-size: 13px; cursor: pointer; border: none; border-radius: 3px; background-color: #eee; color: #333; }
    button:disabled, input[type="range"]:disabled { opacity: 0.5; cursor: not-allowed; }
    input[type="range"] { width: 70px; }
    
    .locked-btn { background-color: #d9534f !important; color: white !important; }
    #focus-lock-btn { background-color: #5bc0de; color: white; }
    #focus-lock-btn.locked-btn { background-color: #f0ad4e !important; }
    .active-filter-btn { background-color: #3b5998 !important; color: white !important; }
    .svg-filter-hide { position: absolute; width: 0; height: 0; pointer-events: none; }
    #camera-panel { flex-basis: 100%; display: none; background-color: #333; margin-top: 2px; }
  </style>
</head>
<body>

  <div id="password-screen">
    <h2>カメラルシダ</h2>
    <p>製品版パスワード、または<br>お試し用パスワードを入力してください</p>
    <input type="password" id="pass-input" placeholder="パスワードを入力">
    <button id="login-btn">アプリを起動</button>
    <p id="error-msg"></p>
  </div>

  <svg class="svg-filter-hide">
    <filter id="navy-tint">
      <feColorMatrix type="matrix" values="0.33 0.33 0.33 0 0 0.33 0.33 0.33 0 0.15 0.33 0.33 0.33 0 0.5 0 0 0 1 0" />
    </filter>
  </svg>

  <!-- 全画面時の上部ボタン群 -->
  <button id="floating-lock-btn">🔓 ロック</button>
  <button id="show-ui-btn">⚙️ メニューを表示</button>
  
  <button id="toggle-image-btn">👁️ 隠す</button> 
  
  <div id="tone-controls">
    <span style="font-size:10px; color:#ddd; margin-right:1px;">抽出:</span>
    <button class="tone-btn active-tone" data-tone="all" style="background:#eee; color:#333; width:26px;">全</button>
    <button class="tone-btn" data-tone="0" style="background:#000000; color:#fff;" title="一番暗い影">1</button>
    <button class="tone-btn" data-tone="1" style="background:#2a2a2a; color:#fff;">2</button>
    <button class="tone-btn" data-tone="2" style="background:#555555; color:#fff;">3</button>
    <button class="tone-btn" data-tone="3" style="background:#808080; color:#fff;">4</button>
    <button class="tone-btn" data-tone="4" style="background:#aaaaaa; color:#000;">5</button>
    <button class="tone-btn" data-tone="5" style="background:#d4d4d4; color:#000;">6</button>
    <button class="tone-btn" data-tone="6" style="background:#ffffff; color:#000;" title="一番明るい光">7</button>
  </div>

  <div id="controls">
    <div class="control-group">
      <button id="custom-image-btn">🖼️ 画像</button>
      <input type="file" id="image-input" accept="image/*" style="display: none;">
    </div>
    <div class="control-group">
      <label>透過:</label><input type="range" id="opacity-slider" min="0" max="100" value="50">
      <label>サイズ:</label><input type="range" id="scale-slider" min="0.1" max="3" step="0.1" value="1">
    </div>
    <div class="control-group">
      <button id="rotate-btn" title="90度回転">🔄</button>
      <button id="flip-btn" title="左右反転">↔</button>
      <button id="navy-btn">🔵 白黒化</button>
    </div>
    <div class="control-group">
      <button id="lock-btn">🔓 ロック</button>
      <button id="anchor-btn">📍 アンカー</button>
      <button id="camera-settings-btn">⚙️ カメラ</button>
    </div>
    <div class="control-group" style="margin-left: auto;">
      <button id="hide-ui-btn">👁️ メニューを隠す</button>
    </div>
    <div class="control-group" id="camera-panel">
      <label for="camera-select">カメラ:</label><select id="camera-select"><option value="">検索中...</option></select>
      <button id="focus-lock-btn" disabled>AFロック</button>
    </div>
  </div>

  <div id="video-container">
    <div id="workspace">
      <video id="camera-view" autoplay playsinline></video>
      <div id="image-wrapper">
        <img id="reference-image" alt="お手本画像" draggable="false">
        <div class="anchor-point" id="anchor-1" style="left: 30%; top: 50%;"><div class="anchor-circle"></div><span>1</span></div>
        <div class="anchor-point" id="anchor-2" style="left: 70%; top: 50%;"><div class="anchor-circle"></div><span>2</span></div>
      </div>
    </div>
  </div>

  <script>
    // --- パスワード処理 ---
    const passwordScreen = document.getElementById('password-screen');
    const passInput = document.getElementById('pass-input');
    const loginBtn = document.getElementById('login-btn');
    const errorMsg = document.getElementById('error-msg');
    const SECRET_PASSWORD = "camera2026"; 
    const TRIAL_PASSWORD = "trial";       
    const TRIAL_DAYS = 7;                 

    loginBtn.addEventListener('click', () => {
      const inputVal = passInput.value;
      if (inputVal === SECRET_PASSWORD) {
        passwordScreen.style.display = 'none'; init(); 
      } else if (inputVal === TRIAL_PASSWORD) {
        const now = new Date().getTime();
        let trialStart = localStorage.getItem('cameraLucidaTrialStart');
        if (!trialStart) {
          localStorage.setItem('cameraLucidaTrialStart', now); alert("お試し版を開始します。\n本日から7日間利用可能です。");
          passwordScreen.style.display = 'none'; init();
        } else {
          const diffDays = Math.floor((now - parseInt(trialStart)) / (1000 * 60 * 60 * 24));
          const leftDays = TRIAL_DAYS - diffDays;
          if (leftDays > 0) { alert(`お試し期間中です。\n（残り ${leftDays} 日）`); passwordScreen.style.display = 'none'; init(); } 
          else { errorMsg.innerHTML = "お試し期間が終了しました。<br>製品版をご購入ください。"; errorMsg.style.display = 'block'; }
        }
      } else { errorMsg.textContent = "パスワードが違います"; errorMsg.style.display = 'block'; }
    });
    passInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') loginBtn.click(); });

    // --- 要素取得 ---
    const videoElement = document.getElementById('camera-view');
    const cameraSelect = document.getElementById('camera-select');
    const imageInput = document.getElementById('image-input');
    const customImageBtn = document.getElementById('custom-image-btn');
    const imageWrapper = document.getElementById('image-wrapper');
    const refImage = document.getElementById('reference-image');
    const workspace = document.getElementById('workspace');
    const videoContainer = document.getElementById('video-container');
    const controlsDiv = document.getElementById('controls');
    
    const opacitySlider = document.getElementById('opacity-slider');
    const scaleSlider = document.getElementById('scale-slider');
    const rotateBtn = document.getElementById('rotate-btn');
    const flipBtn = document.getElementById('flip-btn');
    const navyBtn = document.getElementById('navy-btn');
    const lockBtn = document.getElementById('lock-btn');
    const floatingLockBtn = document.getElementById('floating-lock-btn'); // ★追加
    const focusLockBtn = document.getElementById('focus-lock-btn');
    
    const hideUiBtn = document.getElementById('hide-ui-btn');
    const showUiBtn = document.getElementById('show-ui-btn');
    const toggleImageBtn = document.getElementById('toggle-image-btn');
    const cameraSettingsBtn = document.getElementById('camera-settings-btn');
    const cameraPanel = document.getElementById('camera-panel');
    const toneControls = document.getElementById('tone-controls');
    const toneBtns = document.querySelectorAll('.tone-btn');

    const anchorBtn = document.getElementById('anchor-btn');
    const anchor1 = document.getElementById('anchor-1');
    const anchor2 = document.getElementById('anchor-2');

    let currentStream = null, isImageLocked = false, isFocusLocked = false, isImageHidden = false, isAnchorVisible = false;
    let originalImageObj = new Image(); 
    let isNavy = false; 

    // --- ★変更：UIトグル（フローティングロックボタンの表示/非表示を連動） ---
    hideUiBtn.addEventListener('click', () => { 
      controlsDiv.style.display = 'none'; 
      showUiBtn.style.display = 'block'; 
      // 画像が読み込まれていれば左上のロックボタンを表示する
      if(originalImageObj.src) floatingLockBtn.style.display = 'block'; 
    });
    
    showUiBtn.addEventListener('click', () => { 
      controlsDiv.style.display = 'flex'; 
      showUiBtn.style.display = 'none'; 
      floatingLockBtn.style.display = 'none'; 
    });
    
    cameraSettingsBtn.addEventListener('click', () => {
      if (cameraPanel.style.display === 'none') { cameraPanel.style.display = 'flex'; cameraSettingsBtn.classList.add('active-filter-btn'); } 
      else { cameraPanel.style.display = 'none'; cameraSettingsBtn.classList.remove('active-filter-btn'); }
    });
    customImageBtn.addEventListener('click', () => { imageInput.click(); });
    
    // --- ★変更：画像を隠すボタン（アンカーは残すため、refImageのopacityを操作） ---
    toggleImageBtn.addEventListener('click', () => {
      isImageHidden = !isImageHidden;
      if (isImageHidden) { 
        refImage.style.opacity = '0'; // 画像だけを完全透明にする
        toggleImageBtn.textContent = '🖼️ 表示'; toggleImageBtn.classList.add('image-hidden-state'); 
      } else { 
        refImage.style.opacity = '1'; 
        toggleImageBtn.textContent = '👁️ 隠す'; toggleImageBtn.classList.remove('image-hidden-state'); 
      }
    });

    anchorBtn.addEventListener('click', () => {
      isAnchorVisible = !isAnchorVisible;
      if(isAnchorVisible) {
        anchor1.style.display = 'block'; anchor2.style.display = 'block';
        anchorBtn.classList.add('active-filter-btn');
      } else {
        anchor1.style.display = 'none'; anchor2.style.display = 'none';
        anchorBtn.classList.remove('active-filter-btn');
      }
    });

    // --- 画像読み込み ---
    imageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          originalImageObj.onload = () => {
            refImage.src = originalImageObj.src;
            imageWrapper.style.display = 'block';
            
            toneControls.style.display = 'flex';
            toggleImageBtn.style.display = 'block';
            isImageHidden = false; refImage.style.opacity = '1'; 
            toggleImageBtn.textContent = '👁️ 隠す'; toggleImageBtn.classList.remove('image-hidden-state');
            
            toneBtns.forEach(b => b.classList.remove('active-tone'));
            document.querySelector('[data-tone="all"]').classList.add('active-tone');
            
            anchor1.style.left = '30%'; anchor1.style.top = '50%';
            anchor2.style.left = '70%'; anchor2.style.top = '50%';
            resetImageTransform();
            
            // もし全画面表示中なら、画像ロード完了とともにフローティングロックボタンを表示
            if (controlsDiv.style.display === 'none') {
              floatingLockBtn.style.display = 'block';
            }
          };
          originalImageObj.src = event.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    // --- トーン抽出ロジック ---
    function setTone(toneLevel) {
      if (!originalImageObj.src) return;
      if (toneLevel === 'all') { refImage.src = originalImageObj.src; return; }
      const canvas = document.createElement('canvas'); canvas.width = originalImageObj.width; canvas.height = originalImageObj.height;
      const ctx = canvas.getContext('2d'); ctx.drawImage(originalImageObj, 0, 0);
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height); const data = imgData.data; const targetLevel = parseInt(toneLevel);
      for (let i = 0; i < data.length; i += 4) {
        if (data[i+3] === 0) continue;
        const brightness = 0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2];
        const currentLevel = Math.min(6, Math.floor((brightness / 256) * 7));
        if (currentLevel === targetLevel) { data[i] = 255; data[i+1] = 0; data[i+2] = 0; data[i+3] = 255; } else { data[i+3] = 0; }
      }
      ctx.putImageData(imgData, 0, 0); refImage.src = canvas.toDataURL();
    }

    toneBtns.forEach(btn => {
      btn.addEventListener('click', (e) => {
        toneBtns.forEach(b => b.classList.remove('active-tone')); e.target.classList.add('active-tone');
        const toneLevel = e.target.dataset.tone; setTone(toneLevel); 
        refImage.style.filter = (toneLevel === 'all' && isNavy) ? 'url(#navy-tint)' : 'none'; 
      });
    });

    navyBtn.addEventListener('click', () => {
      isNavy = !isNavy;
      if (isNavy) { navyBtn.textContent = '🎨 カラー'; navyBtn.classList.add('active-filter-btn'); } 
      else { navyBtn.textContent = '🔵 白黒化'; navyBtn.classList.remove('active-filter-btn'); }
      const activeToneBtn = document.querySelector('.active-tone');
      if (activeToneBtn && activeToneBtn.dataset.tone === 'all') { refImage.style.filter = isNavy ? 'url(#navy-tint)' : 'none'; }
    });

    // --- カメラ処理 ---
    async function init() { await startCamera(null, true); await getCameras(); navigator.mediaDevices.addEventListener('devicechange', getCameras); }
    async function getCameras() {
      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const videoDevices = devices.filter(d => d.kind === 'videoinput');
        cameraSelect.innerHTML = ''; 
        if (videoDevices.length === 0) return cameraSelect.innerHTML = '<option>カメラなし</option>';
        let externalId = null;
        videoDevices.forEach((d, i) => {
          const opt = document.createElement('option'); opt.value = d.deviceId; opt.text = d.label || `カメラ ${i + 1}`;
          cameraSelect.appendChild(opt); if (opt.text.toLowerCase().includes('usb') || opt.text.toLowerCase().includes('external')) externalId = d.deviceId;
        });
        if (!externalId && videoDevices.length > 1) externalId = videoDevices[videoDevices.length - 1].deviceId;
        cameraSelect.value = externalId ? externalId : videoDevices[0].deviceId;
        if(externalId) await startCamera(externalId);
      } catch (err) { console.error(err); }
    }
    async function startCamera(deviceId = null, preferExt = false) {
      if (currentStream) currentStream.getTracks().forEach(t => t.stop());
      const constraints = { video: { width: { ideal: 1920 }, height: { ideal: 1080 } } };
      if (deviceId) constraints.video.deviceId = { exact: deviceId }; else if (preferExt) constraints.video.facingMode = { ideal: "environment" };
      try { currentStream = await navigator.mediaDevices.getUserMedia(constraints); videoElement.srcObject = currentStream; checkFocusCapabilities(); } 
      catch (err) { if (preferExt) startCamera(null, false); }
    }
    cameraSelect.addEventListener('change', () => startCamera(cameraSelect.value));
    function checkFocusCapabilities() {
      if (!currentStream) return; const track = currentStream.getVideoTracks()[0]; const capabilities = track.getCapabilities ? track.getCapabilities() : {};
      if (capabilities.focusMode && capabilities.focusMode.includes('manual')) { focusLockBtn.disabled = false; focusLockBtn.textContent = '🔓 AFロック'; focusLockBtn.classList.remove('locked-btn'); isFocusLocked = false; } 
      else { focusLockBtn.disabled = true; focusLockBtn.textContent = '未対応'; focusLockBtn.classList.remove('locked-btn'); }
    }
    focusLockBtn.addEventListener('click', async () => {
      if (!currentStream) return; const track = currentStream.getVideoTracks()[0];
      if (track.getCapabilities && track.getCapabilities().focusMode) {
        try {
          if (!isFocusLocked) { await track.applyConstraints({ advanced: [{ focusMode: "manual" }] }); isFocusLocked = true; focusLockBtn.textContent = '🔒 ピント固定'; focusLockBtn.classList.add('locked-btn'); } 
          else { await track.applyConstraints({ advanced: [{ focusMode: "continuous" }] }); isFocusLocked = false; focusLockBtn.textContent = '🔓 AFロック'; focusLockBtn.classList.remove('locked-btn'); }
        } catch (err) { console.error(err); }
      }
    });

    // --- ★追加：画像操作ロックの共通関数 ---
    function toggleLockState() {
      isImageLocked = !isImageLocked;
      if (isImageLocked) {
        // パネル内のボタン
        lockBtn.textContent = '🔒 解除'; lockBtn.classList.add('locked-btn');
        // フローティングボタン
        floatingLockBtn.textContent = '🔒 解除'; floatingLockBtn.classList.add('locked-btn');
        
        opacitySlider.disabled = true; scaleSlider.disabled = true; rotateBtn.disabled = true; flipBtn.disabled = true; navyBtn.disabled = true;
        imageWrapper.style.cursor = 'default'; workspace.style.cursor = 'grab'; 
      } else {
        lockBtn.textContent = '🔓 ロック'; lockBtn.classList.remove('locked-btn');
        floatingLockBtn.textContent = '🔓 ロック'; floatingLockBtn.classList.remove('locked-btn');
        
        opacitySlider.disabled = false; scaleSlider.disabled = false; rotateBtn.disabled = false; flipBtn.disabled = false; navyBtn.disabled = false;
        imageWrapper.style.cursor = 'move'; workspace.style.cursor = 'default';
      }
    }
    
    // 両方のボタンに同じ関数を割り当て
    lockBtn.addEventListener('click', toggleLockState);
    floatingLockBtn.addEventListener('click', toggleLockState);

    opacitySlider.addEventListener('input', (e) => { imageWrapper.style.opacity = e.target.value / 100; });

    let imgPosX = 0, imgPosY = 0, imgScale = 1, imgRotate = 0, imgFlipX = 1;
    function updateImageTransform() { 
      imageWrapper.style.transform = `translate(${imgPosX}px, ${imgPosY}px) rotate(${imgRotate}deg) scale(${imgScale * imgFlipX}, ${imgScale})`; 
      
      let invScaleX = 1 / (imgScale * imgFlipX);
      let invScaleY = 1 / imgScale;
      anchor1.style.transform = `translate(-50%, -50%) scale(${invScaleX}, ${invScaleY})`;
      anchor2.style.transform = `translate(-50%, -50%) scale(${invScaleX}, ${invScaleY})`;
    }
    
    function resetImageTransform() {
      imgPosX = 0; imgPosY = 0; imgScale = 1; imgRotate = 0; imgFlipX = 1; scaleSlider.value = 1;
      isNavy = false; refImage.style.filter = 'none'; navyBtn.textContent = '🔵 白黒化'; navyBtn.classList.remove('active-filter-btn');
      updateImageTransform();
    }
    
    scaleSlider.addEventListener('input', (e) => { imgScale = parseFloat(e.target.value); updateImageTransform(); });
    rotateBtn.addEventListener('click', () => { imgRotate -= 90; updateImageTransform(); });
    flipBtn.addEventListener('click', () => { imgFlipX *= -1; updateImageTransform(); });

    // --- ドラッグ・ズーム ---
    let isDraggingImage = false, isDraggingGlobal = false, isDraggingAnchor = false;
    let startMouseX = 0, startMouseY = 0, startImgPosX = 0, startImgPosY = 0;
    let globalScale = 1, globalX = 0, globalY = 0, startGlobalX = 0, startGlobalY = 0;
    let initialPinchDistance = null, initialGlobalScale = 1;
    let activeAnchor = null;

    function updateGlobalTransform() { workspace.style.transform = `translate(${globalX}px, ${globalY}px) scale(${globalScale})`; }
    function resetGlobalZoom() { globalScale = 1; globalX = 0; globalY = 0; updateGlobalTransform(); }

    videoContainer.addEventListener('dblclick', () => { if (isImageLocked) resetGlobalZoom(); });
    videoContainer.addEventListener('wheel', (e) => {
      if (!isImageLocked) return; e.preventDefault(); const zoomSpeed = 0.1;
      if (e.deltaY < 0) globalScale += zoomSpeed; else globalScale -= zoomSpeed;
      globalScale = Math.max(1, Math.min(globalScale, 5)); if (globalScale === 1) { globalX = 0; globalY = 0; }
      updateGlobalTransform();
    }, { passive: false });

    function startAnchorDrag(e, anchor) {
      if (isImageLocked) return;
      e.preventDefault(); e.stopPropagation();
      isDraggingAnchor = true; activeAnchor = anchor;
      startMouseX = e.clientX || (e.touches && e.touches[0].clientX);
      startMouseY = e.clientY || (e.touches && e.touches[0].clientY);
      
      let leftPx = parseFloat(anchor.style.left);
      let topPx = parseFloat(anchor.style.top);
      if (anchor.style.left.includes('%')) leftPx = (parseFloat(anchor.style.left) / 100) * imageWrapper.offsetWidth;
      if (anchor.style.top.includes('%')) topPx = (parseFloat(anchor.style.top) / 100) * imageWrapper.offsetHeight;
      
      anchor.dataset.startLeft = leftPx;
      anchor.dataset.startTop = topPx;
    }
    anchor1.addEventListener('mousedown', (e) => startAnchorDrag(e, anchor1));
    anchor1.addEventListener('touchstart', (e) => startAnchorDrag(e, anchor1), {passive: false});
    anchor2.addEventListener('mousedown', (e) => startAnchorDrag(e, anchor2));
    anchor2.addEventListener('touchstart', (e) => startAnchorDrag(e, anchor2), {passive: false});

    function startImageDrag(clientX, clientY) {
      if (isImageLocked) return; isDraggingImage = true;
      startMouseX = clientX; startMouseY = clientY; startImgPosX = imgPosX; startImgPosY = imgPosY;
    }
    imageWrapper.addEventListener('mousedown', (e) => { startImageDrag(e.clientX, e.clientY); e.preventDefault(); e.stopPropagation(); });
    imageWrapper.addEventListener('touchstart', (e) => { if (isImageLocked) return; if (e.touches.length === 1) { startImageDrag(e.touches[0].clientX, e.touches[0].clientY); e.preventDefault(); e.stopPropagation(); } }, { passive: false });

    function startGlobalDrag(clientX, clientY) {
      if (!isImageLocked) return; isDraggingGlobal = true;
      startMouseX = clientX; startMouseY = clientY; startGlobalX = globalX; startGlobalY = globalY; workspace.style.cursor = 'grabbing';
    }
    workspace.addEventListener('mousedown', (e) => { startGlobalDrag(e.clientX, e.clientY); e.preventDefault(); });
    workspace.addEventListener('touchstart', (e) => {
      if (!isImageLocked) return;
      if (e.touches.length === 2) { initialPinchDistance = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); initialGlobalScale = globalScale; e.preventDefault(); } 
      else if (e.touches.length === 1) { startGlobalDrag(e.touches[0].clientX, e.touches[0].clientY); e.preventDefault(); }
    }, { passive: false });

    function handleMove(clientX, clientY) {
      if (isDraggingAnchor && activeAnchor) {
        let deltaX = clientX - startMouseX;
        let deltaY = clientY - startMouseY;
        deltaX *= imgFlipX; 
        
        let angle = ((imgRotate % 360) + 360) % 360;
        let localDx = deltaX, localDy = deltaY;
        if (angle === 90 || angle === -270) { localDx = deltaY; localDy = -deltaX; }
        else if (angle === 180 || angle === -180) { localDx = -deltaX; localDy = -deltaY; }
        else if (angle === 270 || angle === -90) { localDx = -deltaY; localDy = deltaX; }
        
        localDx /= imgScale; localDy /= imgScale;
        
        let newLeft = parseFloat(activeAnchor.dataset.startLeft) + localDx;
        let newTop = parseFloat(activeAnchor.dataset.startTop) + localDy;
        activeAnchor.style.left = `${newLeft}px`; activeAnchor.style.top = `${newTop}px`;
        return;
      }
      
      if (isDraggingImage) { imgPosX = startImgPosX + (clientX - startMouseX); imgPosY = startImgPosY + (clientY - startMouseY); updateImageTransform(); } 
      else if (isDraggingGlobal) { globalX = startGlobalX + (clientX - startMouseX); globalY = startGlobalY + (clientY - startMouseY); updateGlobalTransform(); }
    }
    document.addEventListener('mousemove', (e) => { if (isDraggingImage || isDraggingGlobal || isDraggingAnchor) { handleMove(e.clientX, e.clientY); } });
    document.addEventListener('touchmove', (e) => {
      if (isDraggingImage || isDraggingGlobal || isDraggingAnchor) { handleMove(e.touches[0].clientX, e.touches[0].clientY); e.preventDefault(); } 
      else if (isImageLocked && e.touches.length === 2 && initialPinchDistance) {
        const currentDistance = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        globalScale = initialGlobalScale * (currentDistance / initialPinchDistance); globalScale = Math.max(1, Math.min(globalScale, 5)); updateGlobalTransform(); e.preventDefault();
      }
    }, { passive: false });

    function endDrag() { 
      isDraggingImage = false; isDraggingGlobal = false; isDraggingAnchor = false; activeAnchor = null; initialPinchDistance = null; 
      if (isImageLocked) workspace.style.cursor = 'grab'; 
    }
    document.addEventListener('mouseup', endDrag); document.addEventListener('touchend', endDrag);
  </script>
</body>
