<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>カメラ・ルシダ アプリ - レッド抽出・UI改善版</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="カメラルシダ">

  <style>
    body {
      margin: 0; padding: 0; background-color: #333; color: white;
      font-family: sans-serif; display: flex; flex-direction: column;
      height: 100vh; overflow: hidden; 
    }

    /* パスワード画面 */
    #password-screen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background-color: #222; z-index: 9999; display: flex; flex-direction: column;
      justify-content: center; align-items: center;
    }
    #password-screen h2 { margin-bottom: 20px; }
    #password-screen p { margin-bottom: 10px; font-size: 14px; color: #ccc; text-align: center; line-height: 1.5; }
    #pass-input {
      padding: 10px; font-size: 16px; margin-bottom: 15px; border-radius: 5px;
      border: none; text-align: center; width: 220px;
    }
    #login-btn {
      padding: 10px 20px; font-size: 16px; background-color: #5cb85c; color: white;
      border: none; border-radius: 5px; font-weight: bold; cursor: pointer;
    }
    #error-msg {
      color: #d9534f; margin-top: 15px; display: none; font-weight: bold;
      text-align: center; padding: 0 20px;
    }
    
    /* フローティングボタン（上部メニュー表示） */
    #show-ui-btn { position: absolute; top: 15px; right: 15px; z-index: 100; background-color: rgba(0, 0, 0, 0.6); color: white; border: 1px solid #777; padding: 10px 15px; border-radius: 5px; font-size: 14px; cursor: pointer; display: none; }
    
    /* ★変更：画像ON/OFFボタン（左下） */
    #toggle-image-btn { 
      position: absolute; bottom: 20px; left: 10px; z-index: 100; 
      background-color: rgba(0, 0, 0, 0.6); color: white; border: 1px solid #777; 
      padding: 10px 12px; border-radius: 8px; font-size: 13px; font-weight: bold; 
      cursor: pointer; display: none; 
    }
    .image-hidden-state { background-color: #5cb85c !important; border-color: #4cae4c !important; }
    
    /* ★変更：濃淡パレット用デザイン（右下フローティング） */
    #tone-controls {
      position: absolute; bottom: 20px; right: 10px; z-index: 100; 
      background-color: rgba(0, 0, 0, 0.6); border: 1px solid #777;
      padding: 6px 8px; border-radius: 8px;
      display: none; /* 初期は非表示 */
      gap: 4px; align-items: center;
    }
    .tone-btn {
      width: 26px; height: 26px; padding: 0 !important; border-radius: 4px;
      font-weight: bold; font-size: 12px; display: flex; justify-content: center; align-items: center;
      border: 1px solid #555 !important; cursor: pointer;
    }
    .active-tone {
      outline: 2px solid #ff4d4d; outline-offset: 1px; z-index: 2; border-color: #fff !important;
    }
    
    /* 上部操作パネル（隠せるエリア） */
    #controls { padding: 8px; background-color: #222; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; border-bottom: 1px solid #444; z-index: 10; max-height: 50vh; overflow-y: auto; }
    .control-group { display: flex; align-items: center; gap: 5px; background: #444; padding: 4px 8px; border-radius: 5px; flex-wrap: wrap; font-size: 13px; }
    #hide-ui-btn { background-color: #5cb85c; color: white; font-weight: bold; }

    #video-container { flex-grow: 1; display: flex; justify-content: center; align-items: center; overflow: hidden; position: relative; background-color: #000; touch-action: none; }
    #workspace { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; position: absolute; transform-origin: center center; }
    video { max-width: 100%; max-height: 100%; z-index: 1; }
    #reference-image { position: absolute; max-width: 100%; max-height: 100%; z-index: 2; opacity: 0.5; display: none; cursor: move; user-select: none; touch-action: none; pointer-events: auto; }
    
    select, button { padding: 5px 8px; font-size: 13px; cursor: pointer; border: none; border-radius: 3px; background-color: #eee; color: #333; }
    button:disabled, input[type="range"]:disabled { opacity: 0.5; cursor: not-allowed; }
    input[type="range"] { width: 70px; }
    
    .locked-btn { background-color: #d9534f !important; color: white !important; }
    #focus-lock-btn { background-color: #5bc0de; color: white; }
    #focus-lock-btn.locked-btn { background-color: #f0ad4e !important; }
    .active-filter-btn { background-color: #3b5998 !important; color: white !important; }
    .svg-filter-hide { position: absolute; width: 0; height: 0; pointer-events: none; }
    #camera-panel { flex-basis: 100%; display: none; background-color: #333; margin-top: 2px; }
  </style>
</head>
<body>

  <!-- パスワード入力画面 -->
  <div id="password-screen">
    <h2>カメラルシダ</h2>
    <p>製品版パスワード、または<br>お試し用パスワードを入力してください</p>
    <input type="password" id="pass-input" placeholder="パスワードを入力">
    <button id="login-btn">アプリを起動</button>
    <p id="error-msg"></p>
  </div>

  <svg class="svg-filter-hide">
    <filter id="navy-tint">
      <feColorMatrix type="matrix" values="0.33 0.33 0.33 0 0 0.33 0.33 0.33 0 0.15 0.33 0.33 0.33 0 0.5 0 0 0 1 0" />
    </filter>
  </svg>

  <button id="show-ui-btn">⚙️ メニューを表示</button>
  
  <!-- ★常時表示エリア（画面最下部） -->
  <button id="toggle-image-btn">👁️ 隠す</button> 
  
  <div id="tone-controls">
    <span style="font-size:11px; color:#ddd; margin-right:2px;">抽出:</span>
    <button class="tone-btn active-tone" data-tone="all" style="background:#eee; color:#333; width:30px;">全</button>
    <!-- ボタンの見た目は元の濃さを表し、抽出結果は赤になります -->
    <button class="tone-btn" data-tone="0" style="background:#000; color:#fff;" title="一番暗い影">1</button>
    <button class="tone-btn" data-tone="1" style="background:#404040; color:#fff;">2</button>
    <button class="tone-btn" data-tone="2" style="background:#808080; color:#fff;">3</button>
    <button class="tone-btn" data-tone="3" style="background:#c0c0c0; color:#000;">4</button>
    <button class="tone-btn" data-tone="4" style="background:#fff; color:#000;" title="一番明るい光">5</button>
  </div>

  <!-- 上部の隠せる操作メニュー -->
  <div id="controls">
    <div class="control-group">
      <button id="custom-image-btn">🖼️ 画像</button>
      <input type="file" id="image-input" accept="image/*" style="display: none;">
    </div>
    
    <div class="control-group">
      <label>透過:</label><input type="range" id="opacity-slider" min="0" max="100" value="50">
      <label>サイズ:</label><input type="range" id="scale-slider" min="0.1" max="3" step="0.1" value="1">
    </div>
    
    <div class="control-group">
      <button id="rotate-btn" title="90度回転">🔄</button>
      <button id="flip-btn" title="左右反転">↔</button>
      <button id="navy-btn">🔵 白黒化</button>
    </div>
    
    <div class="control-group">
      <button id="lock-btn">🔓 ロック</button>
      <button id="camera-settings-btn">⚙️ カメラ</button>
    </div>
    
    <div class="control-group" style="margin-left: auto;">
      <button id="hide-ui-btn">👁️ メニューを隠す</button>
    </div>
    
    <div class="control-group" id="camera-panel">
      <label for="camera-select">カメラ:</label><select id="camera-select"><option value="">検索中...</option></select>
      <button id="focus-lock-btn" disabled>AFロック</button>
    </div>
  </div>

  <div id="video-container">
    <div id="workspace">
      <video id="camera-view" autoplay playsinline></video>
      <img id="reference-image" alt="お手本画像" draggable="false">
    </div>
  </div>

  <script>
    // --- パスワード処理 ---
    const passwordScreen = document.getElementById('password-screen');
    const passInput = document.getElementById('pass-input');
    const loginBtn = document.getElementById('login-btn');
    const errorMsg = document.getElementById('error-msg');

    const SECRET_PASSWORD = "camera2026"; 
    const TRIAL_PASSWORD = "trial";       
    const TRIAL_DAYS = 7;                 

    loginBtn.addEventListener('click', () => {
      const inputVal = passInput.value;
      if (inputVal === SECRET_PASSWORD) {
        passwordScreen.style.display = 'none';
        init(); 
      } else if (inputVal === TRIAL_PASSWORD) {
        const now = new Date().getTime();
        let trialStart = localStorage.getItem('cameraLucidaTrialStart');
        if (!trialStart) {
          localStorage.setItem('cameraLucidaTrialStart', now);
          alert("お試し版を開始します。\n本日から7日間利用可能です。");
          passwordScreen.style.display = 'none';
          init();
        } else {
          const diffTime = now - parseInt(trialStart);
          const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
          const leftDays = TRIAL_DAYS - diffDays;
          if (leftDays > 0) {
            alert(`お試し期間中です。\n（残り ${leftDays} 日）`);
            passwordScreen.style.display = 'none';
            init();
          } else {
            errorMsg.innerHTML = "お試し期間（7日間）が終了しました。<br>製品版をご購入ください。";
            errorMsg.style.display = 'block';
          }
        }
      } else {
        errorMsg.textContent = "パスワードが違います";
        errorMsg.style.display = 'block';
      }
    });

    passInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') loginBtn.click(); });

    // --- 要素取得 ---
    const videoElement = document.getElementById('camera-view');
    const cameraSelect = document.getElementById('camera-select');
    const imageInput = document.getElementById('image-input');
    const customImageBtn = document.getElementById('custom-image-btn');
    const refImage = document.getElementById('reference-image');
    const workspace = document.getElementById('workspace');
    const videoContainer = document.getElementById('video-container');
    const controlsDiv = document.getElementById('controls');
    
    const opacitySlider = document.getElementById('opacity-slider');
    const scaleSlider = document.getElementById('scale-slider');
    const rotateBtn = document.getElementById('rotate-btn');
    const flipBtn = document.getElementById('flip-btn');
    const navyBtn = document.getElementById('navy-btn');
    const lockBtn = document.getElementById('lock-btn');
    const focusLockBtn = document.getElementById('focus-lock-btn');
    
    const hideUiBtn = document.getElementById('hide-ui-btn');
    const showUiBtn = document.getElementById('show-ui-btn');
    const toggleImageBtn = document.getElementById('toggle-image-btn');
    const cameraSettingsBtn = document.getElementById('camera-settings-btn');
    const cameraPanel = document.getElementById('camera-panel');
    const toneControls = document.getElementById('tone-controls');
    const toneBtns = document.querySelectorAll('.tone-btn');

    let currentStream = null, isImageLocked = false, isFocusLocked = false, isImageHidden = false;
    let originalImageObj = new Image(); 

    // --- UIトグル ---
    hideUiBtn.addEventListener('click', () => { controlsDiv.style.display = 'none'; showUiBtn.style.display = 'block'; });
    showUiBtn.addEventListener('click', () => { controlsDiv.style.display = 'flex'; showUiBtn.style.display = 'none'; });
    cameraSettingsBtn.addEventListener('click', () => {
      if (cameraPanel.style.display === 'none') { cameraPanel.style.display = 'flex'; cameraSettingsBtn.classList.add('active-filter-btn'); } 
      else { cameraPanel.style.display = 'none'; cameraSettingsBtn.classList.remove('active-filter-btn'); }
    });
    customImageBtn.addEventListener('click', () => { imageInput.click(); });
    toggleImageBtn.addEventListener('click', () => {
      isImageHidden = !isImageHidden;
      if (isImageHidden) { refImage.style.display = 'none'; toggleImageBtn.textContent = '🖼️ 表示'; toggleImageBtn.classList.add('image-hidden-state'); } 
      else { refImage.style.display = 'block'; toggleImageBtn.textContent = '👁️ 隠す'; toggleImageBtn.classList.remove('image-hidden-state'); }
    });

    // --- 画像読み込みと濃淡抽出機能 ---
    imageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          originalImageObj.onload = () => {
            refImage.src = originalImageObj.src;
            refImage.style.display = 'block';
            
            // 下部のボタン群を表示
            toneControls.style.display = 'flex';
            toggleImageBtn.style.display = 'block';
            isImageHidden = false;
            toggleImageBtn.textContent = '👁️ 隠す'; 
            toggleImageBtn.classList.remove('image-hidden-state');
            
            toneBtns.forEach(b => b.classList.remove('active-tone'));
            document.querySelector('[data-tone="all"]').classList.add('active-tone');
            
            resetImageTransform();
          };
          originalImageObj.src = event.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    // ★変更：指定階調を「赤ベース」で抽出するロジック
    function applyToneFilter(toneLevel) {
      if (!originalImageObj.src) return;
      if(isNavy) navyBtn.click(); // ネイビー化と競合しないよう解除

      if (toneLevel === 'all') {
        refImage.src = originalImageObj.src;
        return;
      }

      const canvas = document.createElement('canvas');
      canvas.width = originalImageObj.width;
      canvas.height = originalImageObj.height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(originalImageObj, 0, 0);

      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imgData.data;
      const targetLevel = parseInt(toneLevel);

      for (let i = 0; i < data.length; i += 4) {
        const r = data[i], g = data[i+1], b = data[i+2], a = data[i+3];
        if (a === 0) continue;

        const brightness = 0.299 * r + 0.587 * g + 0.114 * b;
        const currentLevel = Math.min(4, Math.floor(brightness / 51));

        if (currentLevel === targetLevel) {
          // ★抽出された部分を「赤（Red）」に塗りつぶす
          data[i] = 255;   // R
          data[i+1] = 0;   // G
          data[i+2] = 0;   // B
          data[i+3] = 255; // Alpha
        } else {
          // それ以外の階調は透明にする
          data[i+3] = 0; 
        }
      }
      ctx.putImageData(imgData, 0, 0);
      refImage.src = canvas.toDataURL();
    }

    toneBtns.forEach(btn => {
      btn.addEventListener('click', (e) => {
        toneBtns.forEach(b => b.classList.remove('active-tone'));
        e.target.classList.add('active-tone');
        applyToneFilter(e.target.dataset.tone);
      });
    });


    // --- カメラ処理 ---
    async function init() {
      await startCamera(null, true);
      await getCameras();
      navigator.mediaDevices.addEventListener('devicechange', getCameras);
    }
    async function getCameras() {
      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const videoDevices = devices.filter(d => d.kind === 'videoinput');
        cameraSelect.innerHTML = ''; 
        if (videoDevices.length === 0) return cameraSelect.innerHTML = '<option>カメラなし</option>';
        let externalId = null;
        videoDevices.forEach((d, i) => {
          const opt = document.createElement('option'); opt.value = d.deviceId; opt.text = d.label || `カメラ ${i + 1}`;
          cameraSelect.appendChild(opt);
          if (opt.text.toLowerCase().includes('usb') || opt.text.toLowerCase().includes('external')) externalId = d.deviceId;
        });
        if (!externalId && videoDevices.length > 1) externalId = videoDevices[videoDevices.length - 1].deviceId;
        cameraSelect.value = externalId ? externalId : videoDevices[0].deviceId;
        if(externalId) await startCamera(externalId);
      } catch (err) { console.error(err); }
    }
    async function startCamera(deviceId = null, preferExt = false) {
      if (currentStream) currentStream.getTracks().forEach(t => t.stop());
      const constraints = { video: { width: { ideal: 1920 }, height: { ideal: 1080 } } };
      if (deviceId) constraints.video.deviceId = { exact: deviceId };
      else if (preferExt) constraints.video.facingMode = { ideal: "environment" };
      try {
        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        videoElement.srcObject = currentStream; checkFocusCapabilities();
      } catch (err) { if (preferExt) startCamera(null, false); }
    }
    cameraSelect.addEventListener('change', () => startCamera(cameraSelect.value));
    function checkFocusCapabilities() {
      if (!currentStream) return;
      const track = currentStream.getVideoTracks()[0];
      const capabilities = track.getCapabilities ? track.getCapabilities() : {};
      if (capabilities.focusMode && capabilities.focusMode.includes('manual')) {
        focusLockBtn.disabled = false; focusLockBtn.textContent = '🔓 AFロック'; focusLockBtn.classList.remove('locked-btn'); isFocusLocked = false;
      } else { focusLockBtn.disabled = true; focusLockBtn.textContent = '未対応'; focusLockBtn.classList.remove('locked-btn'); }
    }
    focusLockBtn.addEventListener('click', async () => {
      if (!currentStream) return;
      const track = currentStream.getVideoTracks()[0];
      if (track.getCapabilities && track.getCapabilities().focusMode) {
        try {
          if (!isFocusLocked) {
            await track.applyConstraints({ advanced: [{ focusMode: "manual" }] });
            isFocusLocked = true; focusLockBtn.textContent = '🔒 ピント固定'; focusLockBtn.classList.add('locked-btn');
          } else {
            await track.applyConstraints({ advanced: [{ focusMode: "continuous" }] });
            isFocusLocked = false; focusLockBtn.textContent = '🔓 AFロック'; focusLockBtn.classList.remove('locked-btn');
          }
        } catch (err) { console.error(err); }
      }
    });

    // --- ★変更：画像操作ロック（トーンボタンはロックしない） ---
    lockBtn.addEventListener('click', () => {
      isImageLocked = !isImageLocked;
      if (isImageLocked) {
        lockBtn.textContent = '🔒 解除'; lockBtn.classList.add('locked-btn');
        opacitySlider.disabled = true; scaleSlider.disabled = true; rotateBtn.disabled = true; flipBtn.disabled = true; navyBtn.disabled = true;
        // ※ toneBtns.forEach(b => b.disabled = true); を削除し、ロック中でもトーン切り替え可能にしました
        refImage.style.cursor = 'default'; workspace.style.cursor = 'grab'; 
      } else {
        lockBtn.textContent = '🔓 ロック'; lockBtn.classList.remove('locked-btn');
        opacitySlider.disabled = false; scaleSlider.disabled = false; rotateBtn.disabled = false; flipBtn.disabled = false; navyBtn.disabled = false;
        refImage.style.cursor = 'move'; workspace.style.cursor = 'default';
      }
    });
    opacitySlider.addEventListener('input', (e) => { refImage.style.opacity = e.target.value / 100; });

    let imgPosX = 0, imgPosY = 0, imgScale = 1, imgRotate = 0, imgFlipX = 1; let isNavy = false;
    function updateImageTransform() { refImage.style.transform = `translate(${imgPosX}px, ${imgPosY}px) rotate(${imgRotate}deg) scale(${imgScale * imgFlipX}, ${imgScale})`; }
    function resetImageTransform() {
      imgPosX = 0; imgPosY = 0; imgScale = 1; imgRotate = 0; imgFlipX = 1; scaleSlider.value = 1;
      isNavy = false; refImage.style.filter = 'none'; navyBtn.textContent = '🔵 白黒化'; navyBtn.classList.remove('active-filter-btn');
      updateImageTransform();
    }
    scaleSlider.addEventListener('input', (e) => { imgScale = parseFloat(e.target.value); updateImageTransform(); });
    rotateBtn.addEventListener('click', () => { imgRotate -= 90; updateImageTransform(); });
    flipBtn.addEventListener('click', () => { imgFlipX *= -1; updateImageTransform(); });
    navyBtn.addEventListener('click', () => {
      isNavy = !isNavy;
      if (isNavy) { refImage.style.filter = 'url(#navy-tint)'; navyBtn.textContent = '🎨 カラー'; navyBtn.classList.add('active-filter-btn'); } 
      else { refImage.style.filter = 'none'; navyBtn.textContent = '🔵 白黒化'; navyBtn.classList.remove('active-filter-btn'); }
    });

    // --- ドラッグ・ズーム ---
    let isDraggingImage = false, isDraggingGlobal = false;
    let startMouseX = 0, startMouseY = 0, startImgPosX = 0, startImgPosY = 0;
    let globalScale = 1, globalX = 0, globalY = 0, startGlobalX = 0, startGlobalY = 0;
    let initialPinchDistance = null, initialGlobalScale = 1;

    function updateGlobalTransform() { workspace.style.transform = `translate(${globalX}px, ${globalY}px) scale(${globalScale})`; }
    function resetGlobalZoom() { globalScale = 1; globalX = 0; globalY = 0; updateGlobalTransform(); }

    videoContainer.addEventListener('dblclick', () => { if (isImageLocked) resetGlobalZoom(); });
    videoContainer.addEventListener('wheel', (e) => {
      if (!isImageLocked) return; e.preventDefault(); const zoomSpeed = 0.1;
      if (e.deltaY < 0) globalScale += zoomSpeed; else globalScale -= zoomSpeed;
      globalScale = Math.max(1, Math.min(globalScale, 5)); if (globalScale === 1) { globalX = 0; globalY = 0; }
      updateGlobalTransform();
    }, { passive: false });

    function startImageDrag(clientX, clientY) {
      if (isImageLocked) return; isDraggingImage = true;
      startMouseX = clientX; startMouseY = clientY; startImgPosX = imgPosX; startImgPosY = imgPosY;
    }
    refImage.addEventListener('mousedown', (e) => { startImageDrag(e.clientX, e.clientY); e.preventDefault(); e.stopPropagation(); });
    refImage.addEventListener('touchstart', (e) => { if (isImageLocked) return; if (e.touches.length === 1) { startImageDrag(e.touches[0].clientX, e.touches[0].clientY); e.preventDefault(); e.stopPropagation(); } }, { passive: false });

    function startGlobalDrag(clientX, clientY) {
      if (!isImageLocked) return; isDraggingGlobal = true;
      startMouseX = clientX; startMouseY = clientY; startGlobalX = globalX; startGlobalY = globalY; workspace.style.cursor = 'grabbing';
    }
    workspace.addEventListener('mousedown', (e) => { startGlobalDrag(e.clientX, e.clientY); e.preventDefault(); });
    workspace.addEventListener('touchstart', (e) => {
      if (!isImageLocked) return;
      if (e.touches.length === 2) { initialPinchDistance = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); initialGlobalScale = globalScale; e.preventDefault(); } 
      else if (e.touches.length === 1) { startGlobalDrag(e.touches[0].clientX, e.touches[0].clientY); e.preventDefault(); }
    }, { passive: false });

    function handleMove(clientX, clientY) {
      if (isDraggingImage) { imgPosX = startImgPosX + (clientX - startMouseX); imgPosY = startImgPosY + (clientY - startMouseY); updateImageTransform(); } 
      else if (isDraggingGlobal) { globalX = startGlobalX + (clientX - startMouseX); globalY = startGlobalY + (clientY - startMouseY); updateGlobalTransform(); }
    }
    document.addEventListener('mousemove', (e) => { if (isDraggingImage || isDraggingGlobal) { handleMove(e.clientX, e.clientY); } });
    document.addEventListener('touchmove', (e) => {
      if (isDraggingImage || isDraggingGlobal) { handleMove(e.touches[0].clientX, e.touches[0].clientY); e.preventDefault(); } 
      else if (isImageLocked && e.touches.length === 2 && initialPinchDistance) {
        const currentDistance = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        globalScale = initialGlobalScale * (currentDistance / initialPinchDistance); globalScale = Math.max(1, Math.min(globalScale, 5)); updateGlobalTransform(); e.preventDefault();
      }

    function endDrag() { isDraggingImage = false; isDraggingGlobal = false; initialPinchDistance = null; if (isImageLocked) workspace.style.cursor = 'grab'; }
    document.addEventListener('mouseup', endDrag); document.addEventListener('touchend', endDrag);
  </script>
